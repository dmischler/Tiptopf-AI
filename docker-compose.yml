services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - tiptopf-data:/app/data
    environment:
      - DATA_DIR=/app/data
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/library"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  tiptopf-data:
